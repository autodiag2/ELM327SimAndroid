import java.io.ByteArrayOutputStream

def runCmd(List<String> cmd) {
    def args = cmd.collect { it.toString() }
    def process = new ProcessBuilder(args)
        .redirectErrorStream(true)
        .start()

    def out = new ByteArrayOutputStream()
    process.inputStream.withStream { it.transferTo(out) }

    def exitCode = process.waitFor()
    def stdout = out.toString("UTF-8").trim()

    if (exitCode != 0) {
        throw new GradleException("Command failed (${exitCode}): ${cmd.join(' ')}\n${stdout}")
    }

    return stdout
}

tasks.register("bumpVersion") {
  doLast {
    def gradleFile = file("build.gradle")
    if (!gradleFile.exists()) throw new GradleException("Missing: ${gradleFile}")

    runCmd(["git", "rev-parse", "--is-inside-work-tree"])
    def status = runCmd(["git", "status", "--porcelain"])
    if (status) throw new GradleException("Working tree not clean. Commit or stash first.\n${status}")

    def s = gradleFile.getText("UTF-8")

    def m = (s =~ /versionCode\s+(\d+)/)
    if (!m.find()) throw new GradleException("versionCode not found in ${gradleFile}")
    def oldCode = Integer.parseInt(m.group(1))
    def newCode = oldCode + 1

    s = s.replaceFirst(/versionCode\s+\d+/, "versionCode ${newCode}")

    if ((s =~ /versionName\s+"[^"]*"/).find()) {
      s = s.replaceFirst(/versionName\s+"[^"]*"/, "versionName \"${newCode}\"")
    } else if ((s =~ /versionName\s+'[^']*'/).find()) {
      s = s.replaceFirst(/versionName\s+'[^']*'/, "versionName \"${newCode}\"")
    } else {
      throw new GradleException("versionName not found in ${gradleFile}")
    }

    gradleFile.write(s, "UTF-8")

    runCmd(["git", "add", gradleFile.path])
    runCmd(["git", "commit", "-m", "chore: bump version to ${newCode}"])
    def tag = "v${newCode}"

    def existing = ""
    try { existing = runCmd(["git", "tag", "-l", tag]) } catch(Exception ignored) { }
    if (existing) throw new GradleException("Tag already exists: ${tag}")

    runCmd(["git", "tag", "-a", tag, "-m", tag])

    println("Bumped: versionCode=${newCode}, versionName=${newCode}, tag=${tag}")
  }
}

def keystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace "com.github.autodiag2.elm327emu"
    compileSdk 35
    ndkVersion "29.0.14206865"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    externalNativeBuild {
        ndkBuild {
            path file("autodiag/jni/Android.mk")
        }
    }

    defaultConfig {
        applicationId "com.github.autodiag2.elm327emu"
        minSdk 28
        targetSdk 35
        versionCode 24
        versionName "24"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
        externalNativeBuild {
            ndkBuild {
                arguments(
                    "NDK_PROJECT_PATH=${projectDir}/autodiag",
                    "APP_BUILD_SCRIPT=${projectDir}/autodiag/jni/Android.mk",
                )
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            } else {
                println("⚠️ No keystore defined → release will NOT be signed")
            }
            minifyEnabled false
        }
    }

}


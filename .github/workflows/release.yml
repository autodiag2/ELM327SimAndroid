name: Build Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install fixed NDK (side-by-side)
        run: |
          sdkmanager --install "ndk;29.0.14206865"

      - name: Submodule update
        run: git submodule update --init --recursive || true

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.ndkVersion=29.0.14206865

      - name: Rename APKs
        run: |
          NS=$(sed -nE 's/^\s*namespace\s+"([^"]+)".*/\1/p' app/build.gradle | head -n1)
          if [ -z "$NS" ]; then
            echo "namespace not found in app/build.gradle"
            exit 1
          fi

          FULL_APK=$(find app/build/outputs/apk/full/release -name "*.apk" | head -n1)
          LIGHT_APK=$(find app/build/outputs/apk/light/release -name "*.apk" | head -n1)

          if [ -z "$FULL_APK" ] || [ -z "$LIGHT_APK" ]; then
            echo "Release APK(s) not found"
            exit 1
          fi

          FULL_OUT="$(dirname "$FULL_APK")/${NS}.apk"
          LIGHT_OUT="$(dirname "$LIGHT_APK")/${NS}-light.apk"

          mv "$FULL_APK" "$FULL_OUT"
          mv "$LIGHT_APK" "$LIGHT_OUT"

          {
            echo "FULL_APK=$FULL_OUT"
            echo "LIGHT_APK=$LIGHT_OUT"
          } >> "$GITHUB_ENV"

      - name: Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FULL_APK }}
            ${{ env.LIGHT_APK }}

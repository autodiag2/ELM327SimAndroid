
name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Explain what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
    validations:
      required: false
